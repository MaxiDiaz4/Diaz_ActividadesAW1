<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retiro Sustentable - Reservas</title>
    <link rel="stylesheet" href="./recursos/css/index.css">
</head>
<body>
    <!-- Mismo layout general que index.html -->
    <header class="bloque-encabezado">
        <a href="index.html" aria-label="Volver al inicio">
            <img src="./recursos/imagenes/logo-rs.svg" alt="Logotipo de Retiro Sustentable">
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="reservas.html">Reservas</a></li>
            </ul>
        </nav>
    </header>

    <main class="bloque-principal">
        <h1>Reservas</h1>
        <h4>Contactanos para asegurar tu lugar</h4>
        
        <!-- El formulario incluye los atributos action y method necesarios para enviar los datos -->
        <form action="procesar_reserva.php" method="POST" class="formulario-reservas">
            
            <!-- Cada label está vinculado a su input mediante for e id por temas de accesibilidad -->
            <label for="id_nombre">Nombre de la persona que consulta:</label>
            <input type="text" id="id_nombre" name="nombre" required>

            <label for="id_telefono">Teléfono:</label>
            <input type="tel" id="id_telefono" name="telefono" required>

            <label for="id_email">Email:</label>
            <input type="email" id="id_email" name="email" required>

            <label for="id_fecha_desde">Fecha desde:</label>
            <input type="date" id="id_fecha_desde" name="fecha_desde" required>

            <label for="id_fecha_hasta">Fecha hasta:</label>
            <input type="date" id="id_fecha_hasta" name="fecha_hasta" required>

            <label for="id_comentario">Comentario:</label>
            <textarea id="id_comentario" name="comentario" rows="4"></textarea>

            <button type="submit">Enviar Reserva</button>
        </form>
    </main>

    <footer class="bloque-pie">
        <p>&copy; 2026 Retiro Sustentable. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
